version: '3.8'

# 🌐 MULTI-NODE TRANSACTION CLUSTER ORCHESTRATION
services:
  fintech-trading-core:
    build: .
    container_name: principal_trading_node_primary
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - DEPLOYMENT_TIER=Principal-FinTech-V
    volumes:
      - .:/app
    networks:
      - fintech_secure_backbone
      
  database-migration-node:
    build: .
    container_name: database_migrator_service
    command: ["python", "database_server.py"]
    volumes:
      - .:/app
    networks:
      - fintech_secure_backbone
  prometheus-telemetry-monitor:
    image: prom/prometheus:latest
    container_name: s_r_e_latency_monitor
    volumes:
      - ./prometheus_metrics.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fintech_secure_backbone
    restart: unless-stopped
    
networks:
  fintech_secure_backbone:
    driver: bridge