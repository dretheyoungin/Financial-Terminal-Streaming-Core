# 📊 ENTERPRISE FINTECH SRE METRICS SPECIFICATION
global:
  scrape_interval: 1s # High-frequency polling for ultra-fast trading data spikes
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'fintech-trading-nodes'
    metrics_path: '/api/v1/trading/metrics'
    static_configs:
      - targets: ['localhost:8000', 'trading_cluster_node_1:8000']
        labels:
          deployment_tier: 'Principal-FinTech-V'
          component_source: 'ASYNCHRONOUS_CORE'

# AUTOMATED LATENCY DROPOUT ALERTS
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'